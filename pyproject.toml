[project]
name = "knowledge-base-platform"
version = "0.1.0"
description = "中文技术支持与操作知识库平台初始化与实现方案"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "alembic>=1.20.1",
    "argon2-cffi>=25.1.0",
    "celery[redis]>=5.7.0",
    "fastapi>=0.163.0",
    "httpx>=0.28.1",
    "huggingface-hub>=2.4.0",
    "jieba>=0.42.1",
    "markdown-it-py>=4.3.0",
    "pdfplumber>=0.11.10",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.3.9",
    "pyjwt>=2.15.1",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.33",
    "pyyaml>=6.0.3",
    "sentence-transformers>=6.3.0",
    "sqlalchemy>=2",
    "transformers>=5.23.0",
    "uvicorn>=0.30",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
