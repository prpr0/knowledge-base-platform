[loggers]
keys=root,httpx,openai

[handlers]
keys=console

[formatters]
keys=flow

[logger_root]
level=INFO
handlers=console

[logger_httpx]
level=WARNING
handlers=
qualname=httpx
propagate=1

[logger_openai]
level=WARNING
handlers=
qualname=openai
propagate=1

[handler_console]
class=StreamHandler
level=INFO
formatter=flow
args=(sys.stderr,)

[formatter_flow]
format=%(asctime)s %(levelname)s %(name)s %(message)s
